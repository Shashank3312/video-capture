<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don't Miss The Moment</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Moment">
<meta name="theme-color" content="#111418">
<style>
  :root {
    --bg: #0f1216; --card: #171c22; --line: #262d36;
    --text: #e8edf3; --dim: #97a3b2; --accent: #4f8cff; --good: #3ddc97; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 48px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 560px; margin-inline: auto;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 6px; }
  input, select, button {
    width: 100%; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #0c1014; color: var(--text);
  }
  input[type=file] { padding: 9px; }
  button {
    background: var(--accent); border: none; color: #fff; font-weight: 600;
    margin-top: 16px; cursor: pointer;
  }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 500; }
  button:disabled { opacity: .5; }
  .modes { display: flex; gap: 8px; }
  .modes button { margin: 0; background: #0c1014; border: 1px solid var(--line); color: var(--dim); font-weight: 500; }
  .modes button[aria-pressed=true] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .job { border-top: 1px solid var(--line); padding: 12px 0; font-size: 14px; }
  .job:first-of-type { border-top: none; }
  .status { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .matched { color: var(--good); } .failed { color: var(--bad); }
  .running, .pending { color: var(--accent); } .expired { color: var(--dim); }
  .muted { color: var(--dim); font-size: 13px; }
  .facecheck { display: flex; gap: 12px; align-items: center; margin-top: 10px;
               padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .facecheck img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
  .facecheck .warn-text { color: #f0c27a; }
  .hits { margin-top: 8px; border-left: 2px solid var(--line); padding-left: 10px; }
  .hit { font-size: 13px; color: var(--dim); margin: 3px 0; }
  .hit b { color: var(--good); font-weight: 600; font-variant-numeric: tabular-nums; }
  .banner { padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .banner.warn { background: #2a1f12; border: 1px solid #4a3618; color: #f0c27a; }
  .hide { display: none; }
</style>
</head>
<body>
  <h1>Don't Miss The Moment</h1>
  <div class="sub">Watch an event for someone, and get told the second they show up.</div>

  <div id="pushBanner" class="banner warn hide">
    <div id="pushMessage"></div>
    <button class="ghost" id="enableBtn"
            style="width:auto;margin-top:10px;padding:8px 14px;font-size:13px">
      Enable notifications
    </button>
  </div>

  <div class="card">
    <label>What should I do?</label>
    <div class="modes">
      <button type="button" data-kind="video" aria-pressed="true">Watch a face</button>
      <button type="button" data-kind="audio" aria-pressed="false">Listen for a name</button>
      <button type="button" data-kind="sports" aria-pressed="false">Cricket</button>
    </div>

    <form id="jobForm">
      <div data-for="video audio">
        <label>Live stream link</label>
        <input name="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
      </div>

      <div data-for="video">
        <label>Reference photo of the person</label>
        <input type="file" name="photo" accept="image/*" id="photoInput">
        <div class="muted">
          Face must be clearly visible - <b>no sunglasses</b>, well lit, looking roughly
          at the camera. Covered eyes make matching unreliable.
        </div>
        <div id="photoCheck" class="hide"></div>
      </div>

      <div data-for="audio">
        <label>Name or phrase to listen for</label>
        <input name="listen_for" placeholder="Ram Charan" autocomplete="off">
      </div>

      <div data-for="video" class="hide" id="alsoListen">
        <label>Also listen for a name (optional)</label>
        <input name="listen_for_video" placeholder="leave blank to only watch" autocomplete="off">
      </div>

      <div data-for="sports">
        <label>Which match?</label>
        <select name="match_id" id="matchPicker">
          <option value="">Loading live matches...</option>
        </select>
        <div class="muted" id="matchNote"></div>
        <label>Player</label>
        <input name="player" placeholder="e.g. Virat Kohli" autocomplete="off">
      </div>

      <div data-for="video audio">
        <label>Stop after (minutes, optional)</label>
        <input name="max_minutes" type="number" min="1" placeholder="leave blank to watch until it ends">

        <label>Tell me</label>
        <select name="alert_mode">
          <option value="once">Once, then stop</option>
          <option value="cooldown">Each time, but not more than once every 5 min</option>
          <option value="every">Every single time</option>
        </select>
      </div>

      <button type="submit" id="startBtn">Start watching</button>
    </form>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong style="font-size:15px">Your jobs</strong>
      <button class="ghost" style="width:auto;margin:0;padding:8px 12px;font-size:13px" id="testBtn">Test notification</button>
    </div>
    <div id="jobs" class="muted" style="margin-top:12px">Nothing yet.</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/app.js"></script>
</body>
</html>
